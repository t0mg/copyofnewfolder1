<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Copyofnewfolder1 game recs archive</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="An archive of indie game recommendations">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📁</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css" />
    <link rel="stylesheet" href="https://docsify.catppuccin.com/mocha/lavender.css" />
    <style>
        .markdown-section hr {
            border: none;
            margin: 0;
        }
    </style>
</head>

<body>
    <div id="app">Loading...</div>

    <script>
        window.$docsify = {
            name: 'copyofnewfolder1 game recs',
            homepage: '2026.md',
            basePath: 'content/',
            loadSidebar: true,
            subMaxLevel: 2,
            auto2top: true,
            search: {
                paths: 'auto',
                placeholder: 'Search...',
                noData: 'No results found.',
                depth: 3,
                namespace: 'yodelog-game-recs-v4', // Incremented to v4 to clear cache for embeds
            }
        }
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script>
        // Monkey-patch marked.lexer to preprocess markdown before it is parsed by Docsify or the search plugin.
        if (window.marked && window.marked.lexer) {
            const originalLexer = window.marked.lexer;
            window.marked.lexer = function (content, options) {
                if (typeof content !== 'string') {
                    return originalLexer.call(this, content, options);
                }

                // Convert bare YouTube links on their own line into responsive embeds
                const youtubeRegex = /^(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})(?:\S*)?$/gm;
                const embedHtml = '<div class="youtube-embed-wrapper" style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; margin: 20px 0; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"><iframe src="https://www.youtube.com/embed/$1" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>';
                let processedContent = content.replace(youtubeRegex, embedHtml);

                // Check if the file is a Yodelog post list (contains frontmatter flag or timestamp headers)
                const isYodelog = processedContent.includes('yodelog: true') || /##.*\{time:\s*[^}]+\}/.test(processedContent);
                if (!isYodelog) {
                    return originalLexer.call(this, processedContent, options);
                }

                // 1. Strip the YAML Frontmatter
                let parsedContent = processedContent.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/, '');

                // 2. Split the document into sections at every "##"
                const sections = parsedContent.split(/^(?=##(?:[ \t]|$|\n))/m);

                // The first section is always the title/header
                const header = sections.shift();

                const now = new Date();
                const visiblePosts = [];

                // 3. Loop through all the posts
                sections.forEach(section => {
                    const timeRegex = /\{time:\s*([^}]+)\}/;
                    const match = section.match(timeRegex);

                    let isPublished = true;

                    // If the post has a time tag, check if it's in the future
                    if (match) {
                        const postDate = new Date(match[1]);
                        if (postDate > now) {
                            isPublished = false; // It's from the future! Hide it from index and view.
                        }
                    }

                    if (isPublished) {
                        // Inject a default title (📝) if the heading is empty, 
                        // to ensure Docsify sidebar and rendering handle it correctly.
                        let processedSection = section.replace(/^##[ \t]*(\{time[^}]+\})?[ \t]*$/m, '## 📝 $1');

                        if (match) {
                            const isoString = match[1];
                            const date = new Date(isoString);
                            const localDate = date.toLocaleString(undefined, {
                                weekday: 'short', year: 'numeric', month: 'short',
                                day: 'numeric', hour: '2-digit', minute: '2-digit'
                            });

                            // HTML block to insert below the heading
                            const dateHtml = `\n<div class="yodelog-date" style="font-size: 0.85em; color: #7f8c8d; margin-top: -10px; margin-bottom: 20px; font-weight: 500;">\n  <time datetime="${isoString}">🕰️ ${localDate} (Local Time)</time>\n</div>\n`;

                            // Strip the {time: ...} from the heading line, and insert the date HTML block right after the heading line
                            processedSection = processedSection.replace(/^##(.*)$/m, (line) => {
                                const cleanHeadingLine = line.replace(timeRegex, '').trim();
                                return cleanHeadingLine + '\n' + dateHtml;
                            });
                        }

                        visiblePosts.push(processedSection);
                    }
                });

                // 4. Reverse the order (Blog Style: Newest First)
                visiblePosts.reverse();

                // 5. Stitch the document back together for the renderer
                const cleanContent = header + visiblePosts.join('\n');
                return originalLexer.call(this, cleanContent, options);
            };
        }
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>

</html>
